name: Quality Autofix

on:
  push:
    branches:
      - ci/required-quality-gates

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ci/required-quality-gates

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.7

      - name: Apply safe lint fixes
        run: ruff check . --fix

      - name: Apply formatter
        run: ruff format .

      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.py'
          git commit -m "style: normalize Python quality baseline"
          git push origin HEAD:ci/required-quality-gates
