name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Project validation (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYGAME_HIDE_SUPPORT_PROMPT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tools/quality/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check --upgrade -r tools/quality/requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        if: ${{ always() }}
        run: ruff format --check .

      - name: Mypy type check
        if: ${{ always() }}
        run: mypy .

      - name: UPD design check
        if: ${{ always() }}
        run: upd-commander-check . --ignore "tests/**" --ignore "tools/**"

      - name: Prepare runtime performance baseline
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: pwsh
        run: |
          $basePath = Join-Path $env:RUNNER_TEMP "obake-perf-base"
          git fetch origin $env:BASE_SHA --depth=1
          git worktree add --detach "$basePath" $env:BASE_SHA

      - name: Baseline engine performance
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        shell: pwsh
        run: python "$env:RUNNER_TEMP\obake-perf-base\tools\performance\check_runtime.py" --config tools/performance/thresholds.json --only engine --output "$env:RUNNER_TEMP\perf-base-engine.json"

      - name: Baseline game performance
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        shell: pwsh
        run: python "$env:RUNNER_TEMP\obake-perf-base\tools\performance\check_runtime.py" --config tools/performance/thresholds.json --only game --output "$env:RUNNER_TEMP\perf-base-game.json"

      - name: Engine runtime performance
        if: ${{ always() }}
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/performance/check_runtime.py --only engine --output tmp/performance/head-engine.json

      - name: Game runtime performance
        if: ${{ always() }}
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tools/performance/check_runtime.py --only game --output tmp/performance/head-game.json

      - name: Runtime performance regression
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: pwsh
        run: python tools/performance/compare_runtime.py --base-engine "$env:RUNNER_TEMP\perf-base-engine.json" --head-engine tmp/performance/head-engine.json --base-game "$env:RUNNER_TEMP\perf-base-game.json" --head-game tmp/performance/head-game.json

      - name: Run project evaluation
        if: ${{ always() }}
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python scripts/evaluate_project.py --frames 180
